[project]
name = "lexiloop"
version = "0.1.0"
description = "LexiLoop content compiler Python media workers"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pymupdf>=1.25",
    "soundfile>=0.13",
]

[project.optional-dependencies]
# PaddleOCR is heavy and only needed for OCR media workers; install it with
# `uv sync --extra ocr`. Kept out of the default env on purpose.
ocr = [
    "paddleocr>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
